<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1rem;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 2px solid rgba(124, 92, 255, 0.2);
      border-top-color: #7c5cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b6b7b; font-size: 0.85rem; }
    .error { color: #f85149; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status">Completing sign in...</p>

  <script>
    // Pass the code and state back to the main page
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (error) {
        document.getElementById('status').textContent = 'Error: ' + error;
        document.getElementById('status').className = 'error';
        setTimeout(() => {
          window.location.href = '/Blog/';
        }, 2000);
        return;
      }

      if (code && state) {
        // Redirect back to main page with the code and state
        const redirectUrl = '/Blog/?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);
        window.location.replace(redirectUrl);
      } else {
        document.getElementById('status').textContent = 'Invalid callback. Redirecting...';
        setTimeout(() => {
          window.location.href = '/Blog/';
        }, 1500);
      }
    })();
  </script>
</body>
</html>
